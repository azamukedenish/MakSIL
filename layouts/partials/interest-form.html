{{ with site.Params.interest_form.url }}
<section class="interest-section" id="interest-form" aria-labelledby="interest-heading">
  <header class="interest-heading">
    <p class="eyebrow">Join the conversation</p>
    <h2 id="interest-heading">Express your interest</h2>
    <p>Tell us about your research interests and how you would like to get involved with MakSIL.</p>
  </header>
  <a class="button" href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="Open form in Google Forms (opens in a new tab)">Open form in Google Forms {{ partial "arrow.html" "up-right" }}</a>
</section>
{{ end }}
